[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "salvador-transcriber"
version = "0.1.0"
description = "Isolated two-channel transcription service skeleton"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.32,<1",
    "websockets>=13,<16",
]

[project.optional-dependencies]
test = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[project.scripts]
salvador-transcriber = "salvador_transcriber.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
salvador_transcriber = ["demo/static/*.html"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["salvador_transcriber"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["uvicorn"]
ignore_missing_imports = true
